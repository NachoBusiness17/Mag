# Complexity / intent → route. Enforced in code with YAML as documentation.
defaults:
  tier: T2
  max_retries: 2
  operating_protocol: personal-router-dungeon-master.v1
  platform_agnostic: true
  implementation_seat: deepseek
  architect_seat: personal_router
  frontier_role: dungeon_master_on_demand
  model_policy: smallest_model_that_passes_task_eval
  janitor_seat: ollama
  evidence_required: true

routes:
  list_or_read: direct
  simple_edit: direct
  multi_step: plan
  hard_code: escalate   # prefer specialist when local weak
  private_hint: local_only

tiers:
  T0: never_model
  T1: ollama_only
  T2: ollama_or_remote
  T3: specialist_ok

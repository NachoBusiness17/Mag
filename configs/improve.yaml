# Allowlists (empty = skip that channel until operator fills)
allowlists:
  x_accounts: []
  substack_rss: []
  github_extra_repos: []
  # On-demand people (e.g. Academia) — not daily
  named_profiles: []
  # - https://independent.academia.edu/GHoard

paths:
  root: memory/improve
  candidates: memory/improve/candidates.jsonl
  daily: memory/improve/daily
  evals: memory/improve/evals
  playbook: memory/improve/playbook.md
  state: memory/improve/state.json

eval:
  run_multi_smoke: true
  # Fixture path relative to ROOT; empty = multi-smoke only for now
  fixtures: []

# Hugging Face / frontier models: not seats — tesuji leaves.
# Template: docs/templates/MODEL_TESUJI.md
# Leaves:   memory/improve/evals/models/{slug}-{date}.md
# Rule: promote practices from Take only; never auto-pull weights.
model_tesuji:
  enabled: true
  template: docs/templates/MODEL_TESUJI.md
  evals_dir: memory/improve/evals/models
  max_open_leaves: 2
  # Bare "Model signal:" stays noise until a leaf exists
  require_leaf_before_promote: true
  example_leaf: memory/improve/evals/models/kimi-k3-2026-07-27.md

# General: identify key features → evaluate → steal → enhance → compose
# Greater-than-sum only when steals share substrate or cancel failure modes.
feature_compose:
  enabled: true
  template: docs/templates/FEATURE_COMPOSE.md
  evals_dir: memory/improve/evals/features
  max_features_per_leaf: 5
  require_compose_for_multi_steal: true
  rule: "Port contracts into Mag; never stack thrones"

promote:
  auto_append_practices_to_playbook: true
  auto_apply_model_seats: false
  auto_apply_prompt_diffs: false

# Field brief synthesis (post scout/eval) — local only, Grok reads field_brief.md
synthesis:
  enabled: true
  use_llm: false         # heuristic markdown only (gemma:2b polish nuked briefs 2026-08-02)
  role: clerk            # janitor gemma:2b only (Hermes/worker parked for brief)
  top_n: 12              # candidates fed into ranking / LLM
  max_tickets: 5         # action tickets in brief
  statuses: [new, hold]  # ignore promoted/rejected

# Opt-in deeper dig after field brief (not on MagImproveDaily by default)
# CLI: python main.py improve --deep [--minutes 60]
# Runs research-pack + local Ollama worker on ranked practice tickets.
# Never auto-promotes; never pulls weights (max_auto_pull_gb still gates).
deep_dive:
  enabled: true
  default_minutes: 60
  max_tickets: 4
  min_score: 12
  kinds: [practice, runtime, paper, risk]
  statuses: [new, hold]
  role: worker           # gemma4 short bursts — not clerk scut
  run_local: true
  auto_promote: false
  require_http_or_local: true

# ILAP v1 — between-version research ritual (docs/ref/MAG_ILAP_PROTOCOL.md)
# Scout rotation + research-pack + field-steal = research agent (no second orchestrator)
# Run worth gate — defer truncate when long run may be valuable (symmetric to behavioral)
# CLI: python main.py run-worth status [--run-id X]
#      python main.py run-worth mark-good RUN_ID --note "DeepSeek refactor was good"
run_worth:
  enabled: true
  max_steps_bad: 100              # agent_churn hint; not auto-kill alone
  max_tool_calls_hard: 32         # run_trail default bound (start_run)
  max_tool_calls_defer: 64        # extend cap when verdict valuable/uncertain
  worth_valuable: 0.55            # score >= → extend
  worth_worthless: 0.25             # score <= → block at hard limit
  hung_timeout_s: 300               # kill hung tasks (~5 min no progress)
  hung_identical_window: 5          # identical tool streak → hung if no artifacts
  hung_zero_artifact_s: 180         # no artifact delta this long → worthless/hung
  velocity_min_per_min: 0.15        # progress velocity floor for valuable
  defer_extensions_max: 2           # max worth-gate extensions per run

ilap:
  enabled: true
  between_version: true          # run full ILAP before version graduation gates
  proposal_template: docs/ref/templates/ILAP-PROPOSAL.md
  protocol: docs/ref/MAG_ILAP_PROTOCOL.md
  verkle_map: docs/ref/memory_verkle_map.md
  steal_pipeline: docs/templates/FEATURE_COMPOSE.md
  training_patterns: [ilap_cycle, research_dive, steal_compose]
  # After scout: routing_smoke + conductor matrix before any BUILD
  aim_commands:
    - python scripts/routing_smoke.py
    - python main.py resonance --tick
    - python main.py verkle-audit --dry

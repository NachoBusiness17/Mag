# Mag improve loop — daily scout → candidates → eval → promote (gated)
# Schema: improve.v1

schema: improve.v1
enabled: true

# Never auto-download model weights unless you raise this (GB). 0 = off.
max_auto_pull_gb: 0

budgets:
  urls_per_day: 10
  research_packs_per_day: 1
  candidates_per_day: 25
  arxiv_abstracts: 15
  x_posts_per_day: 0          # raise only with X allowlist + API later
  remote_llm_for_scout: false # L0 heuristics only unless true + keys

# Week rotation (0=Mon … 6=Sun). Extra tier-B source ids for that day.
rotation:
  0: [github, huggingface, agent_harness]   # Mon — harness/memory
  1: [reddit, ollama, openclaw, mesh_comm]   # Tue — local + OpenClaw + mesh research
  2: [arxiv, anthropic, openai]             # Wed — papers + labs (bias: process value / TTC / continual / plan search → IJL)
  3: [openrouter, deepseek, xai, steal_protocol_repos]            # Thu — routes + steal forest
  4: [google_adk, vast, agent_harness, agent_platform_repos, agent_bleeding_edge_repos]  # Fri — platform + bleeding-edge forests
  5: [catchup]                              # Sat — re-try failed + internal only
  6: [digest]                               # Sun — playbook digest, no outbound

# Always include tier A when not digest-only day
# agent_memory = HF + OpenClaw + harness essays (regular)
tier_a_always: [huggingface, reddit, github, arxiv, mag_internal, agent_memory]

# Mesh/offline comm — local clones + index (not live crawl)
mesh_comm:
  tier: A
  kind_hint: transport
  local_only: true
  index: docs/ref/MESH_COMM_REPOS_INDEX.md
  manifest: configs/mesh_comm_repos.yaml
  pull_script: scripts/pull_mesh_comm_repos.sh
  clone_root: mine/raw/mesh_comm
  note: "ILAP + field-steal on clones; Bitchat Bridgefy Briar contracts only"

# Steal protocol — orchestrator / blackboard / cascade research forest
steal_protocol_repos:
  tier: A
  kind_hint: orchestrator
  local_only: true
  index: docs/ref/STEAL_PROTOCOL_REPOS_INDEX.md
  manifest: configs/steal_protocol_repos.yaml
  pull_script: scripts/pull_steal_protocol_repos.sh
  clone_root: mine/raw/steal_protocol
  note: "Desk observer + PO/SM steal; AgentSwarm bMAS Flock C3 MoA"

# Agent platform — coding agents / workspaces / MCP / IDE-as-client
agent_platform_repos:
  tier: A
  kind_hint: agentic_contract
  local_only: true
  index: docs/ref/AGENT_PLATFORM_REPOS_INDEX.md
  manifest: configs/agent_platform_repos.yaml
  pull_script: scripts/pull_agent_platform_repos.sh
  clone_root: mine/raw/agent_platform
  note: "OpenHands SWE-agent Aider jj MCP Continue Melty — platform camp contracts"

# Bleeding-edge — memory / replay / quiet / A2A / specialist economies (sibling forest)
agent_bleeding_edge_repos:
  tier: A
  kind_hint: agentic_contract
  local_only: true
  index: docs/ref/AGENT_BLEEDING_EDGE_REPOS_INDEX.md
  manifest: configs/agent_bleeding_edge_repos.yaml
  pull_script: scripts/pull_agent_bleeding_edge_repos.sh
  clone_root: mine/raw/agent_bleeding_edge
  note: "Letta Mem0 exo agent-replay A2A AgentOps — B1–B7 contracts; no SaaS memory throne"


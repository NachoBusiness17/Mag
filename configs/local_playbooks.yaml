# Local playbooks — rules of the game authored by frontier, executed by L0
# Chess worked because Local saw: rules + history + legal moves + one output shape.
# Same pattern for desk handoff, code scout, archivist filing.
# Schema: local_playbooks.v1

schema: local_playbooks.v1

defaults:
  desk: desk_canvas_commit
  arena: chess_seat
  scout: code_scout_janitor
  archivist: archivist_filing

playbooks:
  chess_seat:
    label: Chess · legal move seat
    domain: adversarial_probe
    role: player
    teacher_seat: deepseek
    student_seat: local
    context_keys: [fen, legal_moves, move_history, turn_seat]
    output:
      kind: pick_one
      format: san_chess
      max_tokens: 16
      temperature: 0.2
    rules: |
      You are a chess seat. You receive FEN, legal SAN list, and move history.
      Reply EXACTLY ONE move from the legal list — SAN only, no prose.
      If unsure, pick the simplest developing move from the list.

  desk_canvas_commit:
    label: Desk · canvas commit
    domain: slow_to_fast
    role: steering_agent
    teacher_seat: deepseek
    student_seat: local
    context_keys: [goal, board_tail, last_peer, turn, skill_drill]
    output:
      kind: canvas_edit
      format: move_line_or_one_paragraph
      max_tokens: 128
      temperature: 0.15
    rules: |
      You are Local (L0). Your job is ONE canvas edit that commits state — not lane prose.
      Wake DeepSeek only via board edit. Format: bare move line OR one handoff paragraph.
      No ### Local headers. No echo of prior blocks. No promises without canvas commit.

  code_scout_janitor:
    label: Code · janitor scout
    domain: build
    role: coding_agent_l0
    teacher_seat: deepseek
    student_seat: local
    context_keys: [goal, file_paths, grep_hits, test_command]
    output:
      kind: structured
      format: scout_report
      max_tokens: 512
      temperature: 0.2
    rules: |
      You are L0 code scout — read, grep, status only. No architecture. No full rewrites.
      Output sections: ## Status (pass/fail) · ## Files touched · ## Next seat (deepseek|cursor).
      Cite paths. If blocked, one blocker line + escalate_to seat. Max 12 lines.

  archivist_filing:
    label: Archivist · file truth
    domain: memory
    role: archivist
    teacher_seat: deepseek
    student_seat: local
    context_keys: [goal, verkle_tip, gate_table, session_id]
    output:
      kind: structured
      format: filing_block
      max_tokens: 384
      temperature: 0.15
    rules: |
      You are L0 archivist. File what happened — not what should happen.
      Output: ## Filed · one line claim · ## Evidence (paths) · ## Gate row (pass|fail|tbd).
      Every claim must cite a file path or gate id. No v6-v10 scope. No pricing fiction.

  routing_conductor_local:
    label: Routing · local scout
    domain: switchboard
    role: steering_agent
    teacher_seat: deepseek
    student_seat: local
    context_keys: [goal, mesh_summary, switchboard_route]
    output:
      kind: structured
      format: route_scout
      max_tokens: 256
      temperature: 0.2
    rules: |
      Scout only — report seat recommendation from switchboard, do not execute build.
      Output JSON-ish lines: recommend_seat, pack_mode, why_one_line, escalate_if.

teacher_prompt: |
  Author a local_playbook fragment for domain={domain} goal={goal}.
  Local (L0) needs: rules, context_keys, output format, legal_actions boundary.
  Reply markdown: ### Rules · ### Context keys · ### Output format · ### Drill
  Do NOT implement — teach the game Local will play.

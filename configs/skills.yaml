# Mag / operator skill progressive disclosure (not always in L0 prompt)
# Schema: mag_skills.v1
# Load into context-pack only when job matches — skills > MCP flood.

schema: mag_skills.v1
version: "2026-07-27"

# process vs case (memory_verkle_map)
memory_rule: |
  Process lessons → playbook / promote.
  Case facts → residual DNA.
  Mid-goal continuity → trail + progress.md.
  Prompt is never the memory system.

skills:
  - id: operator-quixote
    when: [always_soft]
    load: never_into_l0_full
    note: "Default register for Grok TUI; not Mag janitor dump"

  - id: sovereign-mag
    when: [dispatch, recall, multi_model, quota]
    path: "~/.grok/skills/sovereign-mag/SKILL.md"
    pack_excerpt: true

  - id: strike-chord
    when: [hard_reason, architecture, mirror, priority]
    path: "~/.grok/skills/strike-chord/SKILL.md"
    pack_excerpt: false
    note: "Explicit strike only"

  - id: feature-compose
    when: [improve, model_signal, harness_scout]
    path: docs/templates/FEATURE_COMPOSE.md
    pack_excerpt: true

  - id: model-tesuji
    when: [huggingface, model_signal]
    path: docs/templates/MODEL_TESUJI.md
    pack_excerpt: true

  - id: memory-verkle
    when: [memory, improve, harness, openclaw]
    path: docs/ref/memory_verkle_map.md
    pack_excerpt: true

  - id: run-trail-lattice
    when: [trail, long_horizon, agent]
    path: docs/ref/run_trail_lattice.md
    pack_excerpt: true

  - id: patch-verify
    when: [hard_code, code, fix, edit, refactor]
    path: memory/improve/weaves/W7-patch-verify.md
    pack_excerpt: true
    note: "Mined 2026-08-03: 18/20 run_python calls in one edit session were hand-rolled read->patch->verify->compile. This weave is the 2-call recipe."

  - id: ponytail-ladder
    when: [hard_code, code, fix, edit, refactor, audit, build]
    path: docs/ref/weaves/W8-ponytail-ladder.md
    pack_excerpt: true
    note: "Coding agent skill — YAGNI ladder; run ponytail-audit before merge."

  - id: caveman-prose
    when: [plan, spec, handoff, docs, priority, architecture]
    path: docs/ref/weaves/W9-caveman-prose.md
    pack_excerpt: true
    note: "Plan/doc agent skill — terse specs; run caveman-audit on output."

  - id: tabletop-dnd
    when: [dnd, dungeon, campaign, play, classic, tabletop]
    path: docs/ref/skills/tabletop-dnd.md
    pack_excerpt: true
    note: "Engine-first campaign; classic keep stub; constrained narrate."

  - id: mag-arena
    when: [chess, arena, game, play, benchmark, multi_domain, game_theory]
    path: "~/.grok/skills/mag-arena/SKILL.md"
    pack_excerpt: true
    note: "Games as high-fidelity multi-agent mirrors; chess + tabletop + packs."

  - id: mag-checkin
    when: [checkin, freeze, structure, multi_seat, offload]
    path: "~/.grok/skills/mag-checkin/SKILL.md"
    pack_excerpt: true
    note: "Freeze + network probe + structure orchestra → local_usable."

  - id: mag-route
    when: [route, handoff, dispatch, dont_burn_grok]
    path: "~/.grok/skills/mag-route/SKILL.md"
    pack_excerpt: true
    note: "After plan freeze: FILE scut to Mag seats."

  - id: skill-ecosystem
    when: [skills, skill_map, cursor, agentskills]
    path: docs/ref/SKILL_ECOSYSTEM_MAP.md
    pack_excerpt: true
    note: "External skill taxonomy → Mag map; enhance don't catalog-dump."

job_to_skills:
  scut: [mag-route]
  recall: [sovereign-mag]
  public_summarize: []
  hard_code: [ponytail-ladder, sovereign-mag, run-trail-lattice, patch-verify, mag-route]
  hard_reason: [caveman-prose, sovereign-mag, strike-chord]
  research: [feature-compose, memory-verkle, skill-ecosystem]
  improve: [feature-compose, model-tesuji, memory-verkle]
  plan: [caveman-prose, memory-verkle, mag-checkin]
  audit: [ponytail-ladder, patch-verify]
  default: [memory-verkle, ponytail-ladder]
  play: [tabletop-dnd, mag-arena]
  dnd: [tabletop-dnd, mag-arena]
  campaign: [tabletop-dnd, mag-arena]
  chess: [mag-arena]
  arena: [mag-arena]
  checkin: [mag-checkin, mag-route]
  route: [mag-route, sovereign-mag]
  freeze: [mag-checkin]

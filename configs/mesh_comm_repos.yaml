# Mesh / offline comm research repos — ILAP scout + v5 mesh forest (piped)
# Schema: mesh_comm_repos.v1
# Clones: mine/raw/mesh_comm/ (gitignored) — refresh: scripts/pull_mesh_comm_repos.sh

schema: mesh_comm_repos.v1
as_of: "2026-08-05"
dest_default: mine/raw/mesh_comm

# Research tags for ILAP / FEATURE_COMPOSE / steward-spore
tags:
  - mesh_ble
  - mesh_wifi
  - p2p_sync
  - dual_transport
  - nostr_fallback
  - tor_offline
  - multi_hop
  - no_central_server
  - sdk_embeddable
  - mailbox_bridge
  - willing_participation

repos:
  # --- Bitchat (permissionlesstech) ---
  - id: bitchat
    path: permissionlesstech/bitchat
    url: https://github.com/permissionlesstech/bitchat.git
    license: Unlicense
    platform: ios_macos
    tags: [mesh_ble, dual_transport, nostr_fallback, multi_hop, no_central_server]
    mag_slot: switchboard_peer_transport_research
    steal_focus: dual_transport_routing, ttl_relay, noise_sessions
    note: Primary iOS/macOS; whitepaper in repo

  - id: bitchat-android
    path: permissionlesstech/bitchat-android
    url: https://github.com/permissionlesstech/bitchat-android.git
    license: GPL-3.0
    platform: android
    tags: [mesh_ble, dual_transport, nostr_fallback, multi_hop, tor_offline]
    mag_slot: cross_platform_mesh_protocol
    steal_focus: wifi_aware, foreground_service_mesh, binary_packet_format

  - id: bitchat-georelays
    path: permissionlesstech/georelays
    url: https://github.com/permissionlesstech/georelays.git
    license: check_upstream
    platform: infra
    tags: [nostr_fallback, dual_transport]
    mag_slot: relay_topology_research
    steal_focus: geohash_channels, relay_location_map

  # --- Bridgefy SDK ---
  - id: bridgefy-android
    path: bridgefy/sdk-android
    url: https://github.com/bridgefy/sdk-android.git
    license: check_upstream
    platform: android
    tags: [mesh_ble, sdk_embeddable, multi_hop, willing_participation]
    mag_slot: household_edge_sdk_pattern
    steal_focus: p2p_mesh_broadcast_modes, propagation_profiles

  - id: bridgefy-ios
    path: bridgefy/sdk-ios
    url: https://github.com/bridgefy/sdk-ios.git
    license: check_upstream
    platform: ios
    tags: [mesh_ble, sdk_embeddable, multi_hop]
    mag_slot: household_edge_sdk_pattern
    steal_focus: mesh_transmission_modes, cross_platform_sdk

  - id: bridgefy-flutter
    path: bridgefy/bridgefy_flutter
    url: https://github.com/bridgefy/bridgefy_flutter.git
    license: check_upstream
    platform: flutter
    tags: [mesh_ble, sdk_embeddable]
    mag_slot: cross_platform_embed
    steal_focus: propagation_profile_enum

  - id: bridgefy-react-native
    path: bridgefy/bridgefy-react-native
    url: https://github.com/bridgefy/bridgefy-react-native.git
    license: check_upstream
    platform: react_native
    tags: [mesh_ble, sdk_embeddable, multi_hop, willing_participation]
    mag_slot: cross_platform_embed
    steal_focus: js_bridge_to_native_mesh, household_app_wrapper_pattern
    note: Top-starred org repo; wraps native Android/iOS SDKs

  - id: bridgefy-android-beta
    path: bridgefy/sdk-android-beta
    url: https://github.com/bridgefy/sdk-android-beta.git
    license: check_upstream
    platform: android
    tags: [mesh_ble, sdk_embeddable]
    mag_slot: household_edge_sdk_pattern
    steal_focus: beta_api_drift_vs_stable_sdk
    note: Pre-release channel — compare against sdk-android for contract stability

  - id: bridgefy-ios-beta
    path: bridgefy/sdk-ios-beta
    url: https://github.com/bridgefy/sdk-ios-beta.git
    license: check_upstream
    platform: ios
    tags: [mesh_ble, sdk_embeddable]
    mag_slot: household_edge_sdk_pattern
    steal_focus: beta_api_drift_vs_stable_sdk
    note: Pre-release channel — compare against sdk-ios for contract stability

  # --- Briar (GitHub mirrors; primary dev on GitLab) ---
  - id: briar
    path: briar/briar
    url: https://github.com/briar/briar.git
    primary_url: https://code.briarproject.org/briar/briar.git
    license: GPL-3.0
    platform: android
    tags: [p2p_sync, tor_offline, no_central_server, bluetooth_wifi]
    mag_slot: sovereign_messaging_reference
    steal_focus: sync_without_server, crisis_transport_fallback
    note: GitHub mirror; upstream GitLab is canonical

  - id: briar-mailbox
    path: briar/briar-mailbox
    url: https://github.com/briar/briar-mailbox.git
    primary_url: https://code.briarproject.org/briar/briar-mailbox.git
    license: AGPL-3.0
    platform: server
    tags: [mailbox_bridge, willing_participation, p2p_sync]
    mag_slot: optional_relay_seat_not_throne
    steal_focus: offline_reachability_without_central_social_graph

  - id: briar-desktop
    path: briar/briar-desktop
    url: https://github.com/briar/briar-desktop.git
    primary_url: https://code.briarproject.org/briar/briar-desktop.git
    license: GPL-3.0
    platform: desktop
    tags: [p2p_sync, tor_offline]
    mag_slot: desktop_peer_reference
    steal_focus: multi_device_sync

  - id: briar-onionwrapper
    path: briar/onionwrapper
    url: https://github.com/briar/onionwrapper.git
    license: GPL-3.0
    platform: library
    tags: [tor_offline]
    mag_slot: transport_layer_research
    steal_focus: tor_integration_pattern

# Mag law — same as GSTD forest
law:
  never_default_seat: true
  never_second_dna_store: true
  steal_contracts_only: true
  willing_participation: true   # devices opt-in; no silent mesh enlistment
  tier_max_research: T2
  implement_gate: v4_steward_stable

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Agents — sub-agent fleet</title>
<link rel="stylesheet" href="/static/style.css?v=agents1" />
<style>
body{font-family:ui-monospace,Consolas,monospace;background:#05080a;color:#cfe9dd;margin:0;padding:16px}
body.embed{padding:8px;background:transparent}
body.embed .back,body.embed h1{display:none}
h1{font-size:18px;letter-spacing:2px;color:#39ff9a;margin:0 0 4px}
.sub{color:#7a8f88;font-size:12px;margin-bottom:18px}
a.back{color:#00c8e0;font-size:12px;text-decoration:none}
.row{display:flex;gap:12px;flex-wrap:wrap}
.panel{background:#0a1216;border:1px solid #1c2f33;border-radius:8px;padding:14px;margin-bottom:16px}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#00c8e0;margin:0 0 10px}
label{display:block;font-size:12px;color:#7a8f88;margin:8px 0 3px}
input,textarea,select{width:100%;box-sizing:border-box;background:#0d181c;color:#d7f2e5;border:1px solid #24404a;border-radius:4px;padding:7px 9px;font-size:13px;font-family:inherit}
textarea{min-height:54px;resize:vertical}
.btn{background:#0f3b2f;color:#9dffc8;border:1px solid #1f6b4d;border-radius:4px;padding:7px 14px;font-size:12px;cursor:pointer;letter-spacing:1px}
.btn:hover{background:#14503c}
.btn.danger{background:#3b120f;border-color:#6b1f1a;color:#ff9d9d}
.btn.ghost{background:transparent;border-color:#24404a;color:#7a8f88}
.goal-cell{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #132026;vertical-align:top}
th{color:#7a8f88;text-transform:uppercase;font-size:10px;letter-spacing:1px}
td code{color:#00c8e0}
.status{font-weight:bold}
.status.running{color:#39ff9a}
.status.done{color:#7ac8ff}
.status.failed,.status.timeout,.status.stalled,.status.killed,.status.died{color:#ff7d7d}
.status.queued{color:#ffd37a}
.phase{color:#ffd37a}
.mono{color:#7a8f88;font-size:11px}
pre.log{background:#070c0f;border:1px solid #1c2f33;border-radius:6px;padding:10px;max-height:320px;overflow:auto;font-size:11px;line-height:1.5;color:#a9d6c3;white-space:pre-wrap;word-break:break-word}
#toast{position:fixed;top:14px;right:14px;background:#0f3b2f;border:1px solid #1f6b4d;color:#9dffc8;padding:10px 16px;border-radius:6px;font-size:12px;display:none;z-index:9}
.empty{color:#566b64;text-align:center;padding:24px 0}
.actions button{margin-right:6px}
</style>
</head>
<body>
<h1>AGENTS &#8212; sub-agent fleet</h1>
<div class="sub">Workers: running + last 48h by default. <button class="btn ghost" id="btnShowAll" type="button">Show all history</button></div>
<a class="back" href="/">&#8592; back to Mag desk</a>
<div id="toast"></div>
<div class="row">
  <div class="panel" style="flex:1 1 420px">
    <h2>Launch sub-agent</h2>
    <label for="goal">Goal (required)</label>
    <textarea id="goal" placeholder="e.g. Draft a daily brief for yesterday's sessions, then file it."></textarea>
    <div class="row">
      <div style="flex:1"><label for="provider">Provider</label>
        <select id="provider"><option value="deepseek">deepseek</option><option value="gemini">gemini</option><option value="openrouter">openrouter</option><option value="xai">xai</option><option value="groq">groq</option></select></div>
      <div style="flex:1"><label for="model">Model (opt)</label><input id="model" placeholder="default"/></div>
    </div>
    <div class="row">
      <div style="flex:1"><label for="timeout">Timeout (s)</label><input id="timeout" type="number" value="900" min="60" max="7200"/></div>
      <div style="flex:1"><label for="tag">Tag (opt)</label><input id="tag" placeholder="e.g. brief-0804"/></div>
    </div>
    <div style="margin-top:12px">
      <button class="btn" id="btnSpawn">SPAWN</button>
      <button class="btn" id="btnHeal" title="Watchdog: mark dead died + auto-respawn (bounded)">AUTO-HEAL</button>
      <button class="btn ghost" id="btnReap">REAP STALE</button>
      <button class="btn ghost" id="btnRefresh">REFRESH</button>
    </div>
  </div>
  <div class="panel" style="flex:2 1 560px">
    <h2>Fleet <span class="mono" id="fleetCount"></span></h2>
    <table>
      <thead><tr><th>status</th><th>id</th><th>phase</th><th>tag / goal</th><th>provider</th><th>age</th><th>actions</th></tr></thead>
      <tbody id="taskRows"></tbody>
    </table>
    <div class="empty" id="emptyRow">no tasks yet &#8212; spawn one above.</div>
  </div>
</div>
<div class="panel" id="logPanel" style="display:none">
  <h2>Log <span class="mono" id="logTitle"></span></h2>
  <pre class="log" id="logBody"></pre>
</div>
<script>
const $=id=>document.getElementById(id);
let logTaskId=null, timer=null, showAll=false;
if(/\bembed=1\b/.test(location.search))document.body.classList.add("embed");
function toast(m,ok){const t=$("toast");t.textContent=m;t.style.display="block";t.style.background=ok?"#0f3b2f":"#3b120f";setTimeout(()=>t.style.display="none",3200)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtAge(ts){if(!ts)return"—";const s=Math.max(0,(Date.now()-new Date(ts).getTime())/1000);if(s<60)return Math.round(s)+"s";if(s<3600)return Math.round(s/60)+"m";return(s/3600).toFixed(1)+"h"}
async function api(method,path,body){const r=await fetch(path,{method,headers:body?{"Content-Type":"application/json"}:undefined,body:body?JSON.stringify(body):undefined});let j;try{j=await r.json()}catch(e){j={}};if(!r.ok&&!j.ok)throw new Error(j.error||("HTTP "+r.status));return j}
const TERM=["done","failed","timeout","stalled","killed","died"];
function running(t){return !TERM.includes(t.status)}
async function loadTasks(){try{const path=showAll?"/api/v1/agents?scope=all":"/api/v1/agents";const j=await api("GET",path);renderTasks(j.tasks||[]);if(j.archived_hidden!=null&&j.layman){$("fleetCount").textContent=(j.count||0)+" tasks · "+j.layman}}catch(e){toast("load: "+e.message,false)}}
function actions(t){const id=t.task_id,r=running(t);let h='<div class="actions">';
h+='<button class="btn ghost" onclick="showLog(\''+id+'\')">log</button>';
if(r){h+='<button class="btn ghost" onclick="sendCmd(\''+id+'\',\'steer\')">steer</button>';
h+='<button class="btn ghost" onclick="sendCmd(\''+id+'\',\'pause\')">pause</button>';
h+='<button class="btn danger" onclick="killTask(\''+id+'\')">kill</button>';}
return h+'</div>'}
function renderTasks(tasks){const tb=$("taskRows");tb.innerHTML="";$("fleetCount").textContent=tasks.length+" tasks";$("emptyRow").style.display=tasks.length?"none":"block";
for(const t of tasks){const tr=document.createElement("tr");
const age=t.heartbeat_age_s!=null?t.heartbeat_age_s+"s":fmtAge(t.started_at||t.created_at);
const ph=t.phase?('<span class="phase">'+esc(t.phase)+"</span>"):"—";
const goal=esc((t.goal||"").slice(0,80))+(t.goal&&t.goal.length>80?"…":"");
const tag=t.tag?('<b>'+esc(t.tag)+"</b> — "):"";
tr.innerHTML='<td><span class="status '+esc(t.status)+'">'+esc(t.status)+'</span></td>'+
'<td><code>'+esc(t.task_id)+'</code></td><td>'+ph+'</td>'+
'<td class="goal-cell">'+tag+goal+'</td><td>'+esc(t.provider||"")+'</td><td>'+age+'</td>'+
'<td>'+actions(t)+'</td>';
tb.appendChild(tr);}}
async function spawnTask(){const goal=$("goal").value.trim();if(!goal){toast("goal required",false);return}
const body={goal,provider:$("provider").value,timeout:parseInt($("timeout").value)||900};
if($("model").value.trim())body.model=$("model").value.trim();
if($("tag").value.trim())body.tag=$("tag").value.trim();
$("btnSpawn").disabled=true;
try{const j=await api("POST","/api/v1/agents",body);toast("spawned "+j.task.task_id,true);$("goal").value="";await loadTasks()}catch(e){toast("spawn: "+e.message,false)}finally{$("btnSpawn").disabled=false}}
async function killTask(id){if(!confirm("kill "+id+"?"))return;try{await api("POST","/api/v1/agents/"+id+"/kill",{});toast("killed "+id,true);await loadTasks()}catch(e){toast(e.message,false)}}
async function sendCmd(id,cmd){let body={cmd};
if(cmd==="steer"){const c=prompt("steer context for "+id+":");if(!c||!c.trim())return;body.context=c.trim()}
try{await api("POST","/api/v1/agents/"+id+"/cmd",body);toast(cmd+" sent to "+id,true)}catch(e){toast(e.message,false)}}
async function showLog(id){logTaskId=id;$("logPanel").style.display="block";$("logTitle").textContent=id;
try{const j=await api("GET","/api/v1/agents/"+id+"/log?n=200");$("logBody").textContent=j.log||"(empty log)"}catch(e){$("logBody").textContent="err: "+e.message}}
$("btnSpawn").onclick=spawnTask;
$("btnHeal").onclick=async()=>{$("btnHeal").disabled=true;try{const j=await api("POST","/api/v1/agents/heal",{});toast("heal: reaped "+j.reaped+", respawned "+(j.respawned||[]).length,true);await loadTasks()}catch(e){toast(e.message,false)}finally{$("btnHeal").disabled=false}};
$("btnReap").onclick=async()=>{try{const j=await api("POST","/api/v1/agents/reap",{});toast("reaped "+j.reaped+" stale",true);await loadTasks()}catch(e){toast(e.message,false)}};
$("btnRefresh").onclick=loadTasks;
$("btnShowAll").onclick=()=>{showAll=!showAll;$("btnShowAll").textContent=showAll?"Show recent only":"Show all history";loadTasks()};
loadTasks();
// Real-time: SSE fleet stream; fall back to polling if the stream dies.
let es=null;
function openStream(){es=new EventSource("/api/v1/stream");
es.onmessage=e=>{try{const j=JSON.parse(e.data);if(j.type==="fleet")renderTasks(j.tasks||[])}catch(_){}};
es.onerror=()=>{es.close();es=null;if(!timer)timer=setInterval(pollAll,5000)}}
async function pollAll(){await loadTasks();if(logTaskId){try{const j=await api("GET","/api/v1/agents/"+logTaskId+"/log?n=200");$("logBody").textContent=j.log||"(empty)"}catch(e){}}}
openStream();
</script>
</body>
</html>

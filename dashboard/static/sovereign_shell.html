<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mag Sovereign Shell</title>
  <link rel="stylesheet" href="/static/shell.css?v=1" />
</head>
<body>
  <header class="top">
    <strong>Mag Sovereign Shell</strong>
    <span class="muted">own the chrome · Mag owns the boundary</span>
    <nav>
      <a href="/" target="_blank">Office :8765</a>
      <a href="http://127.0.0.1:8743/" target="_blank">Mirror :8743</a>
    </nav>
  </header>
  <div class="layout">
    <aside class="tree-pane">
      <div class="pane-head">
        <button type="button" id="btnTreeRoot">memory/</button>
        <button type="button" id="btnTreeMag">.</button>
      </div>
      <ul id="fileTree" class="tree"></ul>
    </aside>
    <main class="editor-pane">
      <div class="editor-bar">
        <span id="openPath" class="mono muted">—</span>
        <button type="button" id="btnSave" disabled>Save</button>
      </div>
      <div id="editor" class="editor"></div>
    </main>
    <aside class="agent-pane">
      <div class="pane-head">Mag agent</div>
      <p class="muted sm">Tool loop via your backend — same engine as DeepSeek CLI.</p>
      <textarea id="agentGoal" rows="4" placeholder="Goal for Mag agent…"></textarea>
      <div class="row">
        <select id="agentProvider">
          <option value="deepseek">DeepSeek</option>
          <option value="ollama">Ollama local</option>
        </select>
        <button type="button" id="btnAgentRun">Run turn</button>
      </div>
      <pre id="agentOut" class="agent-out">Ready.</pre>
      <div class="pane-head" style="margin-top:1rem">Autopilot</div>
      <button type="button" id="btnAutopilot">Run once (improve + governor)</button>
      <pre id="autopilotOut" class="agent-out small"></pre>
    </aside>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script src="/static/shell.js?v=1"></script>
</body>
</html>
